services:
  - type: web
    name: smart-shopping-assistant-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URLS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PRODUCT_API_URL
        sync: false
      - key: PRODUCT_API_KEY
        sync: false
      - key: PRICE_CHECK_INTERVAL_MINUTES
        value: "0"
